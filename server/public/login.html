<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MailPing giriş</title>
  <link rel="icon" href="/logo.png" />
  <link rel="stylesheet" href="/panel.css?v=logo1" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <main class="gate">
    <article class="tile">
      <p class="kicker mark"><img src="/logo.png" alt="" width="28" height="28" />MailPing</p>
      <h1>Panel kilidi</h1>
      <p class="lede">VPS’te panel, CV ve Gmail bu şifrenin arkasında. Alıcı piksel / CV linki açık kalır.</p>
      <form id="form">
        <label>
          Şifre
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        </label>
        <p id="error" class="err" hidden></p>
        <button class="btn solid" type="submit">Giriş</button>
      </form>
    </article>
  </main>
  <script src="/login.js"></script>
</body>
</html>
