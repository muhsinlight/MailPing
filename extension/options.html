<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>MailPing ayarları</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    #status { margin-top: 1rem; color: #0a0; }
    .hint { font-size: 0.85rem; color: #555; margin-top: 0.5rem; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>MailPing ayarları</h1>
  <p class="hint">
    Sunucu artık API token kullanmıyor. Mail göndermek ve takip için siteye giriş yapın
    (<strong>Mail gönder</strong>).
  </p>
  <label for="serverUrl">Sunucu adresi (bilgi)</label>
  <input id="serverUrl" type="url" placeholder="https://mailping.sizin-domain.com" />
  <p class="hint">Chrome eklentisi şu an devre dışı. Gmail’den otomatik takip ileride panel oturumu ile gelebilir.</p>
  <button id="save">Adresi kaydet</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
